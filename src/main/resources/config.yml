# Performance tuning. Tracers are the heaviest cosmetic - raise the step / lower the cap
# if the server or clients struggle.
tracer-step: 2.0        # blocks between tracer particles (bigger = lighter)
tracer-max-points: 40   # max tracer particles per shot

# When the server/world has PvP disabled, player-vs-player bullet hits are
# cancelled by the game (this is why guns hurt mobs but not players). With this
# on, guns force the hit through anyway so they always work. Turn it OFF and
# enable real PvP (server.properties pvp=true) if you want proper kill credit
# and to respect no-PvP safe zones.
bypass-pvp: true

# Ballistic armour.
#
# The FIVE CHESTPLATE vests are FIXED built-ins and always exist - you do NOT
# configure them here: ultra_light, light, ballistic, heavy, ultra_heavy.
#
# CUSTOM variants below are for the OTHER slots only - helmet, leggings, boots.
# Add as many as you like; a chestplate entry here is ignored. Fields:
#   slot: helmet | leggings | boots
#   tier: toughness (1..5), absorb-hits: bullets soaked before it breaks
#   slowness: -1 none, 0 = Slowness I, 1 = Slowness II ...  speed-boost: true for Speed I
#   dye: "R,G,B" leather colour   model: custom_model_data string (broken = <model>_broken)
# A helmet guards head shots, leggings leg shots, boots foot shots. The defaults
# below can be tuned or copied. Give with /guns armor give <id> [player]; /guns armor list.
armor:
  light_helmet:
    slot: helmet
    display: "Light Ballistic Helmet"
    color: gray
    tier: 2
    absorb-hits: 1
    slowness: -1
    dye: "188,188,194"
    model: helmet_light
  combat_helmet:
    slot: helmet
    display: "Combat Helmet"
    color: gray
    tier: 3
    absorb-hits: 2
    slowness: -1
    dye: "120,124,110"
    model: helmet_combat
  heavy_helmet:
    slot: helmet
    display: "Heavy Ballistic Helmet"
    color: dark_gray
    tier: 4
    absorb-hits: 2
    slowness: 0
    dye: "96,96,102"
    model: helmet_heavy
  combat_leggings:
    slot: leggings
    display: "Combat Leggings"
    color: gray
    tier: 3
    absorb-hits: 2
    slowness: 0
    dye: "120,124,110"
    model: leggings_combat
  heavy_leggings:
    slot: leggings
    display: "Heavy Ballistic Leggings"
    color: dark_gray
    tier: 4
    absorb-hits: 2
    slowness: 1
    dye: "96,96,102"
    model: leggings_heavy
  combat_boots:
    slot: boots
    display: "Combat Boots"
    color: gray
    tier: 3
    absorb-hits: 1
    slowness: -1
    dye: "120,124,110"
    model: boots_combat
  heavy_boots:
    slot: boots
    display: "Heavy Ballistic Boots"
    color: dark_gray
    tier: 4
    absorb-hits: 2
    slowness: 0
    dye: "96,96,102"
    model: boots_heavy
