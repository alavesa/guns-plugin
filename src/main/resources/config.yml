# ============================ FIRING & ANIMATIONS ============================
# The gun-hand swing is hidden with the OFF-HAND SWING trick: when you left-click a gun, the plugin cancels
# the MAIN-hand (gun) swing and swings the empty OFF-hand instead, so the gun hand stays put. This is done
# automatically in code - no config needed. (The old attribute/component tricks did not work on 26.2 and
# were removed.)
#
# Which mouse button fires:
#   left  = fire on LEFT-click.
#   right = fire on RIGHT-click (use-item); auto-fire repeats while the button is held.
fire-button: left

# StatesMC-style: cancel the arm swing right after each shot (re-equip the held item a tick later so the
# client resets the arm to its rest pose instead of finishing the swing). A frame or two may still slip
# through. Set false to disable.
cancel-swing-on-shot: true

# Removes the MINING swing (the arm-swing you get when you left-click while looking at a block/floor/wall):
# a hidden high-amplifier Mining Fatigue stops the client from starting to mine, so no mining swing. Pairs
# with the swing_animation component (which removes the ATTACK swing on air) for full coverage. Default ON.
gun-mining-fatigue: true

# Hide the arm swing from OTHER players at the packet level too. Only used if ProtocolLib is installed.
hide-swing-protocollib: true

# Optional generic.attack_speed modifier while a gun is held. -100 shows the sword cooldown indicator (the
# StatesMC tell) and stops melee. Does NOT remove the swing. Default 0 (off).
gun:
  attack-speed: 0.0

# Burst fire mode (when a gun's fire-modes include "burst").
burst:
  count: 3          # rounds per burst
  delay-ticks: 2    # ticks between rounds

# FIRST-PERSON item animations (arm baked into the model's firstperson_righthand display). The plugin
# flips the held model through <gunmodel>_<clip>0..N frames you author in the resource pack. OFF until
# you make the frames. This is what gives shooting/reload a first-person animation that is NOT a swing.
fp-anim:
  enabled: false
  fire:   { frames: 4,  frame-ticks: 1 }
  reload: { frames: 10, frame-ticks: 2 }
  equip:  { frames: 6,  frame-ticks: 2 }

# Performance tuning. Tracers are the heaviest cosmetic - raise the step / lower the cap
# if the server or clients struggle.
tracer-step: 2.0        # blocks between tracer particles (bigger = lighter)
tracer-max-points: 40   # max tracer particles per shot

# When the server/world has PvP disabled, player-vs-player bullet hits are
# cancelled by the game (this is why guns hurt mobs but not players). With this
# on, guns force the hit through anyway so they always work. Turn it OFF and
# enable real PvP (server.properties pvp=true) if you want proper kill credit
# and to respect no-PvP safe zones.
bypass-pvp: true

# Ballistic armour.
#
# The FIVE CHESTPLATE vests are FIXED built-ins - you do NOT configure them here:
# ultra_light, light, ballistic, heavy, ultra_heavy.
#
# CUSTOM variants below are for the OTHER slots only (helmet, leggings, boots).
# Fields: slot, tier (toughness), absorb-hits (bullets soaked before breaking),
#   speed-mod (WALK-SPEED as a fraction: -0.05 = -5%, +0.05 = +5%; STACKS across
#   worn pieces because it's an attribute modifier, not a potion), dye "R,G,B",
#   model (custom_model_data; broken = <model>_broken).
# Change any piece's weight in-game with:  /guns armor slowness <id> <percent>
#   e.g. /guns armor slowness heavy -12   (works for the fixed vests too; stored
#   under armor-speed below and re-give the piece for it to apply).
armor:
  light_helmet:    { slot: helmet,   display: "Light Ballistic Helmet",   color: gray,      tier: 2, absorb-hits: 1, speed-mod:  0.00, dye: "188,188,194", model: helmet_light }
  combat_helmet:   { slot: helmet,   display: "Combat Helmet",            color: gray,      tier: 3, absorb-hits: 2, speed-mod: -0.02, dye: "120,124,110", model: helmet_combat }
  heavy_helmet:    { slot: helmet,   display: "Heavy Ballistic Helmet",   color: dark_gray, tier: 4, absorb-hits: 2, speed-mod: -0.05, dye: "96,96,102",   model: helmet_heavy }
  combat_leggings: { slot: leggings, display: "Combat Leggings",          color: gray,      tier: 3, absorb-hits: 2, speed-mod: -0.05, dye: "120,124,110", model: leggings_combat }
  heavy_leggings:  { slot: leggings, display: "Heavy Ballistic Leggings", color: dark_gray, tier: 4, absorb-hits: 2, speed-mod: -0.08, dye: "96,96,102",   model: leggings_heavy }
  combat_boots:    { slot: boots,    display: "Combat Boots",             color: gray,      tier: 3, absorb-hits: 1, speed-mod: -0.02, dye: "120,124,110", model: boots_combat }
  heavy_boots:     { slot: boots,    display: "Heavy Ballistic Boots",    color: dark_gray, tier: 4, absorb-hits: 2, speed-mod: -0.05, dye: "96,96,102",   model: boots_heavy }

# Per-piece walk-speed overrides set by /guns armor slowness (fractions). Applies
# to ANY piece, including the fixed vests. Hand-edit if you like.
armor-speed: {}

# Per-piece THERMAL INSULATION overrides set by /guns armor insulation (whole numbers,
# 0 = none). Near fire an insulated piece keeps you from catching alight, but wears
# its own durability doing so. Applies to any piece, vests included.
armor-insulation: {}
