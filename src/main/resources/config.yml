# Performance tuning. Tracers are the heaviest cosmetic - raise the step / lower the cap
# if the server or clients struggle.
tracer-step: 2.0        # blocks between tracer particles (bigger = lighter)
tracer-max-points: 40   # max tracer particles per shot

# When the server/world has PvP disabled, player-vs-player bullet hits are
# cancelled by the game (this is why guns hurt mobs but not players). With this
# on, guns force the hit through anyway so they always work. Turn it OFF and
# enable real PvP (server.properties pvp=true) if you want proper kill credit
# and to respect no-PvP safe zones.
bypass-pvp: true

# Ballistic armour variants. Make as many as you like across the four slots:
#   slot: helmet | chest | leggings | boots
#   tier: toughness rating (1 light .. 5 heaviest), shown on the item
#   absorb-hits: how many bullets it soaks before it breaks (the "bullet absorption")
#   slowness: -1 none, 0 = Slowness I, 1 = Slowness II ... (heaviest worn piece wins)
#   speed-boost: true gives Speed I while worn (if nothing you wear slows you)
#   dye: "R,G,B" leather colour (tells tiers apart until a pack model is made)
#   model: custom_model_data string for a resource pack (broken variant = <model>_broken)
# A helmet guards head shots, a vest body shots, leggings leg shots, boots foot shots.
# Give with: /guns armor give <id> [player]   (list them with /guns armor list)
armor:
  ultra_light:
    slot: chest
    display: "Ultra Light Ballistic Vest"
    color: gray
    tier: 1
    absorb-hits: 1
    slowness: -1
    speed-boost: true
    dye: "224,224,228"
    model: vest_ultra_light
  light:
    slot: chest
    display: "Light Ballistic Vest"
    color: gray
    tier: 2
    absorb-hits: 1
    slowness: -1
    dye: "188,188,194"
    model: vest_light
  ballistic:
    slot: chest
    display: "Ballistic Vest"
    color: gray
    tier: 3
    absorb-hits: 2
    slowness: 0
    dye: "150,150,156"
    model: vest_ballistic
  heavy:
    slot: chest
    display: "Heavy Ballistic Vest"
    color: dark_gray
    tier: 4
    absorb-hits: 3
    slowness: 1
    dye: "96,96,102"
    model: vest_heavy
  ultra_heavy:
